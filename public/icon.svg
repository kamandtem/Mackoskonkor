<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Elevated Ring -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" opacity="0.1" />

  <!-- Countdown Circular Arc Gauge -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#dialGrad)" stroke-width="20" stroke-dasharray="660 880" stroke-linecap="round" transform="rotate(-90 256 256)" />

  <!-- Center White Disc -->
  <circle cx="256" cy="256" r="100" fill="#ffffff" filter="url(#shadow)" />

  <!-- Graduation Cap & Study Clock Symbol -->
  <path d="M256 195 L320 225 L256 255 L192 225 Z" fill="#4f46e5" />
  <path d="M220 240 L220 275 Q256 295 292 275 L292 240" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
  <path d="M312 230 L324 250 L324 285" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <circle cx="324" cy="288" r="5" fill="#f59e0b" />

  <!-- Glowing Sparkle / Success Star -->
  <path d="M256 305 L260 318 L273 322 L260 326 L256 339 L252 326 L239 322 L252 318 Z" fill="#fbbf24" />
</svg>

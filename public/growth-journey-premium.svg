    <stop offset=".46" stop-color="oklch(91% .045 200)"/>
    <stop offset="1" stop-color="oklch(73% .095 210)"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">

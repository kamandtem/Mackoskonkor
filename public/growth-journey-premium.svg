  <style>
    .fa{font-family:Tahoma,"Segoe UI",Arial,sans-serif;direction:rtl;unicode-bidi:bidi-override}
    .num{font-family:"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
    .label{fill:oklch(27% .055 245);font-size:24px;font-weight:700}
    .small{fill:oklch(43% .055 238);font-size:16px;font-weight:600;letter-spacing:.02em}
    .icon{fill:none;stroke:oklch(34% .08 245);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}

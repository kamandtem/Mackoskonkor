  <filter id="blur48" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="blur18" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="nodeShadow" x="-80%" y="-80%" width="260%" height="260%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="oklch(22% .08 255)" flood-opacity=".2"/>
  </filter>
  <filter id="softTexture" x="-10%" y="-10%" width="120%" height="120%">
